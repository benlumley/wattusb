name: Release

# Every push to main that touches the app runs CI, then publishes a GitHub
# release. The workflow never commits back, and tags created with GITHUB_TOKEN
# do not trigger workflows, so a release cannot start another release.
on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish release
    needs: qa
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    # Serialize releases so two merges cannot claim the same version, and queue
    # every pending run (the default keeps only one and cancels the rest).
    concurrency:
      group: release
      cancel-in-progress: false
      queue: max
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide version
        id: version
        run: |
          base=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Sources/wattusb/Info.plist)
          version=$(sh scripts/next-version.sh "$base")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          if [ -z "$version" ]; then
            echo "A newer release already includes this commit; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif gh release view "v$version" >/dev/null 2>&1; then
            if [ -z "$(git tag --points-at HEAD --list "v$version")" ]; then
              echo "::error::Release v$version exists but is not tagged on this commit (a draft?). Delete or publish it, then re-run."
              exit 1
            fi
            echo "Release v$version already exists for this commit; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$version"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: sh build.sh

      - name: Verify app bundle
        if: steps.version.outputs.publish == 'true'
        run: sh scripts/verify-app.sh "${{ steps.version.outputs.version }}"

      - name: Package and publish
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip="wattusb-$VERSION.zip"
          ditto -c -k --keepParent wattusb.app "$zip"
          cat > notes.md <<EOF
          Download \`$zip\`, unzip it, and move \`wattusb.app\` to /Applications.

          The app is ad-hoc signed (not notarized), so macOS blocks the first launch.
          Approve it once: on macOS 15 (Sequoia) or later, try to open it, then click
          **Open Anyway** in System Settings → Privacy & Security; on macOS 14,
          right-click \`wattusb.app\` → **Open**. Or run:

          \`\`\`sh
          xattr -dr com.apple.quarantine /Applications/wattusb.app
          \`\`\`

          SHA-256: \`$(shasum -a 256 "$zip" | cut -d ' ' -f 1)\`
          EOF
          gh release create "v$VERSION" "$zip" \
            --target "$GITHUB_SHA" \
            --title "wattusb $VERSION" \
            --notes-file notes.md \
            --generate-notes \
            --latest
